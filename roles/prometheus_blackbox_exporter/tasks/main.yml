---
- name: create /opt/prometheus_blackbox_exporter directory
  ansible.builtin.file:
    path: /opt/prometheus_blackbox_exporter
    state: directory
    owner: root
    group: root
    mode: 0750
  changed_when: false

- name: check if binary exists
  ansible.builtin.stat:
    path: /opt/prometheus_blackbox_exporter/blackbox_exporter
  register: binary

- name: check blackbox exporter version
  ansible.builtin.command: /opt/prometheus_blackbox_exporter/blackbox_exporter --version
  register: blackbox_exporter_version_check
  when: binary.stat.exists
  changed_when: false

- name: install blackbox exporter if its not present
  ansible.builtin.unarchive:
    src: "https://github.com/prometheus/blackbox_exporter/releases/download/v\
         {{  blackbox_exporter_version  }}/blackbox_exporter-{{  blackbox_exporter_version  }}.linux-amd64.tar.gz"
    dest: /opt/prometheus_blackbox_exporter
    remote_src: true
  tags:
    - blackbox_exporter
  when: not binary.stat.exists

- name: update blackbox exporter if different version is defined in variable
  ansible.builtin.unarchive:
    src: "https://github.com/prometheus/blackbox_exporter/releases/download/v\
         {{  blackbox_exporter_version  }}/blackbox_exporter-{{  blackbox_exporter_version  }}.linux-amd64.tar.gz"
    dest: /opt/prometheus_blackbox_exporter/
    remote_src: true
  tags:
    - blackbox_exporter
  when: (blackbox_exporter_version_check | regex_search('\d.\d+.\d+') != blackbox_exporter_version)
  notify: restart blackbox_exporter

- name: check if install artifacts exist
  ansible.builtin.stat:
    path: "/opt/prometheus_blackbox_exporter/blackbox_exporter-{{  blackbox_exporter_version  }}.linux-amd64/"
  register: artifacts

- name: stop blackbox_exporter service temporarily
  ansible.builtin.systemd:
    name: blackbox_exporter
    state: stopped
  when: (artifacts.stat.exists) and binary.stat.exists

- name: move blackbox_exporter binary
  ansible.builtin.copy:
    src: "/opt/prometheus_blackbox_exporter/blackbox_exporter-{{  blackbox_exporter_version  }}.linux-amd64/"
    dest: /opt/prometheus_blackbox_exporter
    owner: root
    group: root
    mode: '0750'
    remote_src: true
  when: artifacts.stat.exists

- name: remove artifacts from blackbox exporter install
  ansible.builtin.file:
    path: "{{  item  }}"
    state: absent
  with_items:
    - "/opt/prometheus_blackbox_exporter/blackbox_exporter-{{  blackbox_exporter_version  }}.linux-amd64"
  when: artifacts.stat.exists

- name: start blackbox_exporter service temporarily
  ansible.builtin.systemd:
    name: blackbox_exporter
    state: started
  when: (artifacts.stat.exists) and binary.stat.exists

- name: template systemd unit file
  ansible.builtin.template:
    src: templates/blackbox_exporter.service.j2
    dest: /etc/systemd/system/blackbox_exporter.service
    owner: root
    group: root
    mode: 0750
  tags:
    - blackbox_exporter
  changed_when: false

- name: make directory for blackbox exporter config
  ansible.builtin.file:
    path: /etc/blackbox_exporter
    state: directory
    owner: root
    group: root
    mode: 0640

- name: template blackbox exporter config file
  ansible.builtin.template:
    src: templates/blackbox.yml.j2
    dest: /etc/blackbox_exporter/blackbox.yml
    owner: root
    group: root
    mode: 0640
  tags:
    - template

- name: reload systemd daemon
  ansible.builtin.systemd:
    daemon_reload: true
  tags:
    - blackbox_exporter

- name: enable and start blackbox_exporter service
  ansible.builtin.systemd:
    name: blackbox_exporter
    enabled: true
    state: started
  tags:
    - blackbox_exporter
